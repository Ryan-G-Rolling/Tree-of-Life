name: Core and UI layout checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core regression with strict warnings
        run: make test WARN='-Wall -Wextra -Wpedantic -Werror'
      - name: Memory and undefined behavior checks
        run: make test-sanitize
      - name: Fetch official raylib 5.5 declarations for UI checks
        run: |
          mkdir -p .local/deps/raylib/include
          curl --fail --location --retry 3 https://raw.githubusercontent.com/raysan5/raylib/5.5/src/raylib.h -o .local/deps/raylib/include/raylib.h
      - name: Compile UI and exercise production layouts
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -Iinclude -Idata -I.local/deps/raylib/include -fsyntax-only src/ui.c src/screens.c src/ui_adapter.c src/input.c src/main.c src/render.c src/atmosphere.c src/tex.c src/embedded.c src/codex.c
          make test-layout INC='-Iinclude -Idata -I.local/deps/raylib/include'
          make build/sanitize/test_ui_layout.exe INC='-Iinclude -Idata -I.local/deps/raylib/include'
          build/sanitize/test_ui_layout.exe
  windows:
    # v10 P1-12：Windows 目标一直是隐性债（test-layout 在 MinGW 下链接失败），
    # 这里用 MinGW + 官方 raylib 5.5 开发包真跑一遍核心测试与布局检查。
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make
      - name: Fetch raylib 5.5 (win64 mingw)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\raylib.zip"
          curl.exe -L --retry 3 -o $zip https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_mingw-w64.zip
          Expand-Archive $zip -DestinationPath .local/deps -Force
      - name: Core tests
        run: mingw32-make test WARN='-Wall -Wextra -Wno-unused-parameter'
      - name: Production UI layout test
        run: mingw32-make test-layout
